<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPE</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="ope">
  <header class="top">
    <div class="drag"></div>
    <div class="brand"><img src="img/mark.png" alt="">OPE</div>
    <button class="where" id="where" type="button" title="Open a project">No project open</button>
    <div class="drag"></div>
  </header>

  <nav class="rail" aria-label="Views">
    <button class="ico on" data-view="projects" title="Projects" aria-label="Projects">
      <svg viewBox="0 0 24 24"><path d="M4 5h6l2 2h8v12H4z"/><path d="M8 12h8M8 15h5"/></svg>
    </button>
    <button class="ico" data-view="prompt" title="The OPE prompt" aria-label="The OPE prompt">
      <svg viewBox="0 0 24 24"><path d="M5 7l5 5-5 5"/><path d="M12 17h7"/></svg>
    </button>
    <button class="ico" data-view="learn" title="Learn" aria-label="Learn">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-4 9 4-9 4z"/><path d="M7 11v5c0 1.2 2.2 2.5 5 2.5s5-1.3 5-2.5v-5"/><path d="M21 9v5"/></svg>
    </button>
    <button class="ico" data-view="open" title="Open a project" aria-label="Open a project">
      <svg viewBox="0 0 24 24"><path d="M4 6h6l2 2h8v4"/><path d="M4 6v12h9"/><path d="M17 15v6M14 18h6"/></svg>
    </button>
  </nav>

  <section class="panel projects" id="projects" aria-label="Projects">
    <div class="ph fold" data-fold="projects" title="Fold or open"><span class="label">PROJECTS</span><span class="chev">‹</span></div>
    <div class="pb" id="projectList"></div>
  </section>

  <section class="panel versions hidden" id="versions" aria-label="Versions">
    <div class="ph fold" data-fold="versions" title="Fold or open"><span class="label" id="versionsHead">VERSIONS</span><span class="chev">‹</span></div>
    <div class="pb" id="versionList"></div>
  </section>

  <section class="panel files" id="files" aria-label="Files">
    <div class="ph"><span>EXPLORER</span><span class="count" id="fileCount"></span></div>
    <div class="pb" id="tree"></div>
  </section>

  <section class="panel editor" id="editorPanel" aria-label="Code">
    <div class="tabs">
      <div class="tab" id="tab"><span id="tabName">Welcome</span><i id="dirty" class="dot hidden"></i></div>
      <div class="acts">
        <span class="tag hidden" id="lineTag"></span>
        <button class="btn hidden" id="saveBtn" type="button">Save</button>
        <button class="btn hidden" id="checkBtn" type="button">Checkpoint</button>
      </div>
    </div>
    <div class="notice hidden" id="notice"></div>
    <div class="welcome" id="welcome"></div>
    <div class="welcome hidden" id="learn"></div>
    <div class="code hidden" id="code"></div>
    <div class="blank hidden" id="blank"></div>
  </section>

  <aside class="panel chat" id="chat" aria-label="OPE Chat">
    <div class="ph"><button class="logo-btn" id="chatLogo" type="button" title="Fold or open OPE Chat" aria-label="Fold or open OPE Chat"><img src="img/mark.png" alt=""></button><span class="label">OPE CHAT</span></div>
    <div class="pb log" id="chatLog">
      <div class="soon" id="chatIntro">
        <p class="big">Ask what the code does</p>
        <p>Open a file, or select some lines, and ask. OPE Chat explains. It does not change your code: your AI coder does that.</p>
        <p class="private">Runs on this Mac. Your project never leaves it.</p>
        <div class="setup hidden" id="chatSetup"></div>
      </div>
    </div>
    <form class="ask" id="askForm">
      <div class="pic hidden" id="askPic"><img id="askPicImg" alt=""><span id="askPicText"></span><button type="button" id="askPicX" aria-label="Remove the picture">×</button></div>
      <textarea id="askIn" placeholder="What does this file do?" rows="3"></textarea>
      <input type="file" id="askFile" accept="image/*" hidden>
      <div class="row2"><span id="chatEngine">Looking for a model on this Mac</span><span class="btns"><button class="attach" type="button" id="askAttach" title="Add a picture. OPE reads the words in it." aria-label="Add a picture">+</button><button class="send" type="submit" aria-label="Send">↑</button></span></div>
    </form>
  </aside>

  <footer class="status">
    <span id="statusLeft">Ready</span>
    <span id="statusRight"></span>
  </footer>
</div>

<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true">
  <div class="card" id="sheetCard"></div>
</div>

<script src="vendor/vs/loader.js"></script>
<script src="bridge.js"></script>
<script src="git.js"></script>
<script src="app.js"></script>
<script src="learn/skills.js"></script>
<script src="learn/bank.js"></script>
<script src="learn/bank-01.js"></script>
<script src="learn/bank-23.js"></script>
<script src="learn/bank-45.js"></script>
<script src="learn/bank-67.js"></script>
<script src="learn/bank-solo.js"></script>
<script src="learn/bank-plus.js"></script>
<script src="learn/steps-01.js"></script>
<script src="learn/steps-23.js"></script>
<script src="learn/steps-45.js"></script>
<script src="learn/steps-67.js"></script>
<script src="learn/steps-solo.js"></script>
<script src="learn.js"></script>
</body>
</html>
